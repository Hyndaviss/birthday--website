<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0514"/>
      <stop offset="45%" stop-color="#190e2b"/>
      <stop offset="75%" stop-color="#2d1245"/>
      <stop offset="100%" stop-color="#140620"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffd166" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="800" fill="url(#nightSky)"/>

  <!-- Stars Galore -->
  <g fill="#ffffff">
    <circle cx="100" cy="90" r="1.5" opacity="0.9"/>
    <circle cx="160" cy="180" r="2.5" opacity="0.8"/>
    <circle cx="240" cy="110" r="1.8" opacity="0.7"/>
    <circle cx="320" cy="70" r="3" opacity="0.95"/>
    <circle cx="480" cy="90" r="2" opacity="0.8"/>
    <circle cx="560" cy="160" r="2.5" opacity="0.9"/>
    <circle cx="680" cy="80" r="1.8" opacity="0.7"/>
    <circle cx="730" cy="190" r="2.8" opacity="0.85"/>
    <circle cx="120" cy="290" r="2.2" opacity="0.7"/>
    <circle cx="260" cy="240" r="1.5" opacity="0.85"/>
    <circle cx="390" cy="190" r="2.5" opacity="0.65"/>
    <circle cx="590" cy="270" r="1.8" opacity="0.9"/>
    <circle cx="710" cy="310" r="2" opacity="0.8"/>
    <!-- Shooting star -->
    <line x1="620" y1="90" x2="520" y2="150" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
    <line x1="620" y1="90" x2="550" y2="132" stroke="#ffccd5" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
  </g>

  <!-- Glowing Crescent Moon -->
  <circle cx="620" cy="180" r="120" fill="url(#moonGlow)"/>
  <path d="M 640 120 A 70 70 0 1 0 640 240 A 55 55 0 1 1 640 120 Z" fill="#fff9db"/>

  <!-- Romantic Fairy Light Strings -->
  <path d="M 0 350 Q 200 420 400 370 T 800 360" fill="none" stroke="#522b5b" stroke-width="2"/>
  <g fill="#ffd166">
    <circle cx="100" cy="375" r="5" opacity="0.9"/>
    <circle cx="200" cy="397" r="6" opacity="0.95"/>
    <circle cx="300" cy="390" r="5" opacity="0.9"/>
    <circle cx="400" cy="370" r="6" opacity="0.95"/>
    <circle cx="500" cy="360" r="5" opacity="0.9"/>
    <circle cx="600" cy="365" r="6" opacity="0.95"/>
    <circle cx="700" cy="362" r="5" opacity="0.9"/>
  </g>

  <!-- Hill & Bench Silhouette -->
  <path d="M 0 580 Q 300 520 800 560 L 800 800 L 0 800 Z" fill="#0c0412"/>

  <!-- Couple on Park Bench Looking at Stars -->
  <g fill="#000000" transform="translate(330, 430)">
    <!-- Bench -->
    <rect x="20" y="110" width="120" height="8" rx="2" fill="#1b0821"/>
    <rect x="30" y="118" width="6" height="40" fill="#1b0821"/>
    <rect x="124" y="118" width="6" height="40" fill="#1b0821"/>
    <rect x="20" y="80" width="120" height="6" rx="2" fill="#1b0821"/>
    <rect x="20" y="92" width="120" height="6" rx="2" fill="#1b0821"/>

    <!-- Boy sitting with arm around girl -->
    <ellipse cx="60" cy="50" rx="14" ry="16" fill="#0a020d"/>
    <path d="M 45 68 Q 60 62 75 68 L 80 115 L 55 115 L 50 155 L 40 155 L 44 115 Z" fill="#0a020d"/>
    <!-- Arm wrapping around girl -->
    <path d="M 72 75 Q 85 70 100 78 Q 98 84 85 82 Z" fill="#0a020d"/>

    <!-- Girl leaning head on boy's shoulder -->
    <ellipse cx="88" cy="55" rx="13" ry="14" fill="#0a020d"/>
    <path d="M 80 50 Q 100 45 104 65 Q 102 85 96 90 Q 86 85 80 50 Z" fill="#0a020d"/> <!-- Hair -->
    <path d="M 78 72 Q 90 68 100 72 L 105 115 L 85 115 L 82 155 L 74 155 L 75 115 Z" fill="#0a020d"/>
  </g>

  <!-- Sweet floating small hearts -->
  <path d="M 410 440 C 405 432 397 435 397 442 C 397 448 410 455 410 458 C 410 455 423 448 423 442 C 423 435 415 432 410 440 Z" fill="#ff758c" opacity="0.85"/>

  <!-- Romantic Text Overlay -->
  <text x="400" y="725" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    LOST IN THE STARS WITH YOU ✨
  </text>
  <text x="400" y="760" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" fill="#ffccd5" text-anchor="middle" letter-spacing="0.5">
    Every late night talk with you is my favorite memory
  </text>
</svg>
