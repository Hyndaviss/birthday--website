<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b092b"/>
      <stop offset="50%" stop-color="#3b114d"/>
      <stop offset="100%" stop-color="#180424"/>
    </linearGradient>
    <radialGradient id="cakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9eb5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1b092b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="balloon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff4765"/>
    </linearGradient>
    <linearGradient id="balloon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <linearGradient id="balloon3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad2)"/>
  <circle cx="400" cy="460" r="350" fill="url(#cakeGlow)"/>

  <!-- Confetti / Sparkles -->
  <g opacity="0.8">
    <polygon points="120,180 130,195 115,190" fill="#ffd166"/>
    <polygon points="200,120 215,125 205,135" fill="#ff758c"/>
    <polygon points="650,160 660,175 645,170" fill="#c77dff"/>
    <polygon points="720,220 735,225 725,235" fill="#ffd166"/>
    <polygon points="160,280 175,285 165,295" fill="#48cae4"/>
    <polygon points="680,310 690,325 675,320" fill="#ff758c"/>
    <circle cx="280" cy="190" r="5" fill="#ffd166"/>
    <circle cx="530" cy="180" r="5" fill="#ff758c"/>
    <circle cx="380" cy="140" r="6" fill="#c77dff"/>
  </g>

  <!-- Floating Balloons Left -->
  <g>
    <!-- Strings -->
    <path d="M 180 320 Q 210 400 240 480" stroke="rgba(255,255,255,0.4)" fill="none" stroke-width="2"/>
    <path d="M 230 300 Q 240 390 245 480" stroke="rgba(255,255,255,0.4)" fill="none" stroke-width="2"/>
    <!-- Balloon 1 -->
    <ellipse cx="180" cy="240" rx="45" ry="55" fill="url(#balloon1)"/>
    <polygon points="175,295 185,295 180,302" fill="#ff4765"/>
    <ellipse cx="165" cy="225" rx="10" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 165 225)"/>
    <!-- Balloon 2 -->
    <ellipse cx="230" cy="220" rx="40" ry="50" fill="url(#balloon2)"/>
    <polygon points="225,270 235,270 230,277" fill="#f77f00"/>
    <ellipse cx="218" cy="205" rx="8" ry="14" fill="#ffffff" opacity="0.4" transform="rotate(-20 218 205)"/>
  </g>

  <!-- Floating Balloons Right -->
  <g>
    <!-- Strings -->
    <path d="M 620 310 Q 590 395 560 480" stroke="rgba(255,255,255,0.4)" fill="none" stroke-width="2"/>
    <path d="M 570 290 Q 565 385 555 480" stroke="rgba(255,255,255,0.4)" fill="none" stroke-width="2"/>
    <!-- Balloon 3 -->
    <ellipse cx="620" cy="230" rx="45" ry="55" fill="url(#balloon3)"/>
    <polygon points="615,285 625,285 620,292" fill="#7209b7"/>
    <ellipse cx="605" cy="215" rx="10" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-20 605 215)"/>
    <!-- Balloon 1 duplicate -->
    <ellipse cx="570" cy="210" rx="38" ry="48" fill="url(#balloon1)"/>
    <polygon points="565,258 575,258 570,265" fill="#ff4765"/>
    <ellipse cx="558" cy="198" rx="8" ry="14" fill="#ffffff" opacity="0.4" transform="rotate(-20 558 198)"/>
  </g>

  <!-- Birthday Cake in Center -->
  <g transform="translate(250, 370)">
    <!-- Stand / Plate -->
    <ellipse cx="150" cy="240" rx="170" ry="25" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="150" cy="240" rx="155" ry="20" fill="#f0e6ed"/>

    <!-- Cake Bottom Tier -->
    <rect x="30" y="140" width="240" height="90" rx="10" fill="#7a2846"/>
    <!-- Frosting Swirls -->
    <path d="M 30 140 Q 50 160 70 140 Q 90 160 110 140 Q 130 160 150 140 Q 170 160 190 140 Q 210 160 230 140 Q 250 160 270 140 L 270 155 Q 250 175 230 155 Q 210 175 190 155 Q 170 175 150 155 Q 130 175 110 155 Q 90 175 70 155 Q 50 175 30 155 Z" fill="#ff8da1"/>

    <!-- Cake Top Tier -->
    <rect x="70" y="70" width="160" height="75" rx="8" fill="#993358"/>
    <!-- Top Frosting -->
    <path d="M 70 70 Q 90 85 110 70 Q 130 85 150 70 Q 170 85 190 70 Q 210 85 230 70 L 230 82 Q 210 97 190 82 Q 170 97 150 82 Q 130 97 110 82 Q 90 97 70 82 Z" fill="#ffb3c1"/>

    <!-- Strawberries / Topping -->
    <circle cx="95" cy="65" r="8" fill="#ff2e63"/>
    <circle cx="125" cy="65" r="8" fill="#ff2e63"/>
    <circle cx="150" cy="63" r="9" fill="#ff2e63"/>
    <circle cx="175" cy="65" r="8" fill="#ff2e63"/>
    <circle cx="205" cy="65" r="8" fill="#ff2e63"/>

    <!-- Glowing Candle -->
    <rect x="146" y="25" width="8" height="38" rx="2" fill="#ffd166"/>
    <rect x="149" y="15" width="2" height="10" fill="#333333"/>
    <!-- Candle Flame -->
    <ellipse cx="150" cy="8" rx="7" ry="12" fill="#ffae19"/>
    <ellipse cx="150" cy="9" rx="4" ry="7" fill="#ffffff"/>
    <circle cx="150" cy="8" r="22" fill="#ffae19" opacity="0.3"/>
  </g>

  <!-- Banner / Text Overlay -->
  <text x="400" y="725" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    HAPPIEST BIRTHDAY MY LOVE! 🎂
  </text>
  <text x="400" y="760" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#ffd166" text-anchor="middle" letter-spacing="0.5">
    Celebrating the most precious person in my world ✨
  </text>
</svg>
