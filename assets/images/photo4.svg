<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="warmCafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1215"/>
      <stop offset="50%" stop-color="#4a1c24"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffd59e" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ff758c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a1215" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#warmCafe)"/>
  <circle cx="400" cy="350" r="350" fill="url(#lampGlow)"/>

  <!-- Hanging Warm Lights -->
  <g stroke="#ffb703" stroke-width="2">
    <line x1="250" y1="0" x2="250" y2="180"/>
    <circle cx="250" cy="190" r="14" fill="#ffd166" stroke="none"/>
    <circle cx="250" cy="190" r="35" fill="#ffd166" opacity="0.25" stroke="none"/>

    <line x1="400" y1="0" x2="400" y2="130"/>
    <circle cx="400" cy="140" r="16" fill="#ffd166" stroke="none"/>
    <circle cx="400" cy="140" r="40" fill="#ffd166" opacity="0.3" stroke="none"/>

    <line x1="550" y1="0" x2="550" y2="190"/>
    <circle cx="550" cy="200" r="14" fill="#ffd166" stroke="none"/>
    <circle cx="550" cy="200" r="35" fill="#ffd166" opacity="0.25" stroke="none"/>
  </g>

  <!-- Wooden Cafe Table -->
  <g transform="translate(150, 420)">
    <!-- Table top -->
    <ellipse cx="250" cy="150" rx="230" ry="45" fill="#582f0e"/>
    <ellipse cx="250" cy="145" rx="220" ry="40" fill="#7f4f24"/>
    <rect x="235" y="180" width="30" height="150" fill="#3d1e03"/>

    <!-- Coffee Cup 1 (Her) -->
    <rect x="180" y="115" width="40" height="35" rx="6" fill="#ffffff"/>
    <path d="M 180 125 C 165 125 165 140 180 140" fill="none" stroke="#ffffff" stroke-width="4"/>
    <ellipse cx="200" cy="115" rx="20" ry="6" fill="#a06cd5"/>
    <!-- Steam -->
    <path d="M 195 105 Q 190 95 195 85 Q 200 75 195 65" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 205 108 Q 210 98 205 88 Q 200 78 205 68" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Coffee Cup 2 (Him) -->
    <rect x="280" y="115" width="40" height="35" rx="6" fill="#ffffff"/>
    <path d="M 320 125 C 335 125 335 140 320 140" fill="none" stroke="#ffffff" stroke-width="4"/>
    <ellipse cx="300" cy="115" rx="20" ry="6" fill="#ff758c"/>
    <!-- Steam -->
    <path d="M 295 105 Q 290 95 295 85 Q 300 75 295 65" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 305 108 Q 310 98 305 88 Q 300 78 305 68" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Heart Latte Art on table -->
    <path d="M 250 90 C 242 80 230 84 230 94 C 230 105 250 115 250 120 C 250 115 270 105 270 94 C 270 84 258 80 250 90 Z" fill="#ff4d6d" opacity="0.9"/>
  </g>

  <!-- Text Overlay -->
  <text x="400" y="725" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    ALL OUR SWEET LITTLE MOMENTS ☕
  </text>
  <text x="400" y="760" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" fill="#ffccd5" text-anchor="middle" letter-spacing="0.5">
    Laughing with you over coffee and endless conversations
  </text>
</svg>
